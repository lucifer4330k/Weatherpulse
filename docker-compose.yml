services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - confluent

  broker:
    image: confluentinc/cp-server:7.4.0
    hostname: broker
    container_name: broker
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9101:9101"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: "broker:29092"
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      CONFLUENT_METRICS_ENABLE: "false"
      CONFLUENT_SUPPORT_CUSTOMER_ID: "anonymous"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 8
      start_period: 120s
    networks:
      - confluent

  kafka-init:
    image: confluentinc/cp-server:7.4.0
    depends_on:
      broker:
        condition: service_started
    entrypoint: ["/bin/bash", "/opt/kafka/init-topic.sh"]
    command: ["weather_data_real", "3"]
    volumes:
      - ./scripts/init_kafka_topic.sh:/opt/kafka/init-topic.sh:ro
    networks:
      - confluent
    restart: "no"

  kafka-synthetic-init:
    profiles: [synthetic]
    image: confluentinc/cp-server:7.4.0
    depends_on:
      broker:
        condition: service_started
    entrypoint: ["/bin/bash", "/opt/kafka/init-topic.sh"]
    command: ["weather_data_synthetic", "3"]
    volumes:
      - ./scripts/init_kafka_topic.sh:/opt/kafka/init-topic.sh:ro
    networks:
      - confluent
    restart: "no"

  schema-registry:
    profiles: [observability]
    image: confluentinc/cp-schema-registry:7.4.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://broker:29092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - confluent

  control-center:
    profiles: [observability]
    image: confluentinc/cp-enterprise-control-center:7.4.0
    hostname: control-center
    container_name: control-center
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: "broker:29092"
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      CONFLUENT_METRICS_ENABLE: "false"
      PORT: 9021
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9021/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - confluent

  postgres:
    image: postgres:14.0
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - confluent

  webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: weatherpulse-airflow:2.7.0
    container_name: airflow-webserver
    entrypoint: ["/bin/bash", "/opt/airflow/script/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LOAD_EX: "n"
      EXECUTOR: Sequential
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"
      AIRFLOW__WEBSERVER__SECRET_KEY: "change-this-development-secret-key"
      WEATHER_LOCATIONS_FILE: /opt/airflow/locations.json
    volumes:
      - ./dags:/opt/airflow/dags
      - ./backend/app/data/locations.json:/opt/airflow/locations.json:ro
      - ./script/entrypoint.sh:/opt/airflow/script/entrypoint.sh:ro
    ports:
      - "8080:8080"
    healthcheck:
      # `pgrep` cannot inspect processes under the non-root airflow user in
      # this image, even when the webserver is healthy. Probe Airflow's own
      # health endpoint instead.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - confluent

  scheduler:
    image: weatherpulse-airflow:2.7.0
    container_name: airflow-scheduler
    entrypoint: ["/bin/bash", "/opt/airflow/script/scheduler-entrypoint.sh"]
    depends_on:
      webserver:
        condition: service_healthy
    volumes:
      - ./dags:/opt/airflow/dags
      - ./backend/app/data/locations.json:/opt/airflow/locations.json:ro
      - ./script/scheduler-entrypoint.sh:/opt/airflow/script/scheduler-entrypoint.sh:ro
    environment:
      LOAD_EX: "n"
      EXECUTOR: Sequential
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"
      AIRFLOW__WEBSERVER__SECRET_KEY: "change-this-development-secret-key"
      WEATHER_LOCATIONS_FILE: /opt/airflow/locations.json
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - confluent

  spark-master:
    profiles: [cluster]
    image: apache/spark:3.4.1-python3
    hostname: spark-master
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "9090:8080"
      - "7077:7077"
    networks:
      - confluent

  spark-worker:
    profiles: [cluster]
    image: apache/spark:3.4.1-python3
    hostname: spark-worker
    container_name: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "4", "--memory", "2g", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    networks:
      - confluent

  cassandra_db:
    image: cassandra:4.1
    hostname: cassandra
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES;'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - confluent

  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - confluent

  # Spark Streaming job (Kafka -> Spark -> Cassandra)
  spark-streaming:
    build:
      context: .
      dockerfile: spark/Dockerfile
    image: weatherpulse-spark-streaming
    hostname: spark-streaming
    container_name: spark-streaming
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra_db:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=broker:29092
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_KEYSPACE=spark_streams
      - CASSANDRA_TABLE=weather_data_real
      - KAFKA_TOPIC=weather_data_real
      - WEATHER_SOURCE=open-meteo
      - SPARK_CHECKPOINT_LOCATION=/opt/spark/checkpoints/weather_data_real_v3
    volumes:
      - ./spark_stream.py:/opt/spark/spark_stream.py:ro
      - ./backend/app/schema.py:/opt/spark/weather_schema.py:ro
      - spark_checkpoints:/opt/spark/checkpoints
    command: >
      /opt/spark/bin/spark-submit
      --master ${SPARK_MASTER:-local[2]}
      --driver-memory 1g
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages com.datastax.spark:spark-cassandra-connector_2.12:3.4.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.4.1
      /opt/spark/spark_stream.py
    networks:
      - confluent
    restart: on-failure

  spark-synthetic:
    profiles: [synthetic]
    image: weatherpulse-spark-streaming
    depends_on:
      kafka-synthetic-init:
        condition: service_completed_successfully
      cassandra_db:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      KAFKA_TOPIC: weather_data_synthetic
      WEATHER_SOURCE: synthetic
      CASSANDRA_HOST: cassandra
      CASSANDRA_KEYSPACE: spark_streams
      CASSANDRA_TABLE: weather_data_synthetic
      SPARK_CHECKPOINT_LOCATION: /opt/spark/checkpoints/weather_data_synthetic_v2
    volumes:
      - ./spark_stream.py:/opt/spark/spark_stream.py:ro
      - ./backend/app/schema.py:/opt/spark/weather_schema.py:ro
      - spark_checkpoints:/opt/spark/checkpoints
    command: >
      /opt/spark/bin/spark-submit
      --master local[1]
      --driver-memory 1g
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages com.datastax.spark:spark-cassandra-connector_2.12:3.4.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.4.1
      /opt/spark/spark_stream.py
    networks:
      - confluent
    restart: on-failure

  synthetic-producer:
    profiles: [synthetic]
    image: weatherpulse-airflow:2.7.0
    depends_on:
      kafka-synthetic-init:
        condition: service_completed_successfully
    entrypoint: ["python", "/opt/airflow/scripts/synthetic_weather.py"]
    command: ["--publish", "--per-location", "10", "--seed", "42"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      WEATHER_LOCATIONS_FILE: /opt/airflow/locations.json
    volumes:
      - ./scripts/synthetic_weather.py:/opt/airflow/scripts/synthetic_weather.py:ro
      - ./dags/weather_ingest.py:/opt/airflow/dags/weather_ingest.py:ro
      - ./backend/app/data/locations.json:/opt/airflow/locations.json:ro
    networks:
      - confluent
    restart: "no"

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weather-backend
    ports:
      - "8000:8000"
    volumes:
      - ./frontend/public/geojson/india-districts.geojson:/app/india-districts.geojson:ro
    environment:
      - CASSANDRA_HOSTS=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=spark_streams
      - CASSANDRA_TABLE=weather_data_real
      - CASSANDRA_USERNAME=cassandra
      - CASSANDRA_PASSWORD=cassandra
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    depends_on:
      cassandra_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - confluent
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weather-frontend
    ports:
      - "3000:3000"
      - "5173:3000"
    environment:
      - VITE_API_URL=/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - confluent
    restart: unless-stopped

  streamlit:
    profiles: [analytics]
    build:
      context: ./frontend/streamlit_dashboard
    image: weatherpulse-streamlit:1.40.2
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_BACKEND_URL: http://backend:8000
      STREAMLIT_CACHE_TTL: 60
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - confluent
    restart: unless-stopped

networks:
  confluent:
    driver: bridge

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  postgres_data:
  cassandra_data:
  redis_data:
  spark_checkpoints:
